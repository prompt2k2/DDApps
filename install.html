<!doctype html>
<html lang="en">
  <head>

    <link rel="icon" href="./icons/favicon.ico" sizes="48x48" />

    <link rel="apple-touch-icon" href="./icons/apple-touch-icon-180.png" />

    <meta name="theme-color" content="#1b2540" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Install Kids' Learning Studio on an Amazon Fire, Android tablet or iPad. Free, no accounts, no tracking." />
    <title>Install Kids' Learning Studio</title>
  </head>
  <body>
    <!-- Filled by src/install/main.ts (texts from src/i18n/en.ts). -->
    <main id="install"></main>
    <script type="module" src="/src/install/main.ts"></script>
  </body>
</html>
